<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Home — Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="typography.css">
  </head>
  <body class="home-page">
    <main class="tablet">
      <div class="tablet-camera" aria-hidden="true"></div>
      <div class="tablet-screen">
        <div class="statusbar">
          <span id="clock">9:41</span><span></span>
          <div class="status-icons">
            <svg viewBox="0 0 24 24" aria-label="Wi-Fi" role="img">
              <path
                d="M2 8c6-6 14-6 20 0M5 12c4-4 10-4 14 0M9 16c2-2 4-2 6 0"
              />
              <circle
                cx="12"
                cy="20"
                r="1.3"
                fill="currentColor"
                stroke="none"
              /></svg
            ><span>100%</span
            ><svg viewBox="0 0 29 15" aria-label="Battery" role="img">
              <rect x="1" y="2" width="24" height="11" rx="2" />
              <rect
                x="3.5"
                y="4.5"
                width="19"
                height="6"
                rx=".7"
                fill="currentColor"
                stroke="none"
              />
              <path d="M26 5.5v4" />
            </svg>
          </div>
        </div>
        <div class="dashboard">
          <div class="tiles">
            <a href="portfolio.html" class="tile portfolio"
              ><span class="tile-title">Portfolio</span
              ><span class="tile-footer">Selected work <b>↗</b></span></a
            ><a href="about.html" class="tile about"
              ><span class="tile-title">About</span
              ><span class="tile-footer">Who I am <b>↗</b></span></a
            ><a href="contact.html" class="tile contact"
              ><span class="tile-title">Contact</span
              ><span class="tile-footer">Get in touch <b>↗</b></span></a
            >
            <div
              class="tile tools tools-slider"
              role="group"
              aria-label="작업 이미지 슬라이드"
            >
              <div class="tools-slides" aria-live="off">
                <div class="tools-slide is-active">
                  <img
                    src="assets/slide-01.svg"
                    alt="슬라이드 1: 디자인 작업 이미지 자리"
                    loading="lazy"
                  >
                </div>
                <div class="tools-slide">
                  <img
                    src="assets/slide-02.svg"
                    alt="슬라이드 2: 디자인 작업 이미지 자리"
                    loading="lazy"
                  >
                </div>
                <div class="tools-slide">
                  <img
                    src="assets/slide-03.svg"
                    alt="슬라이드 3: 디자인 작업 이미지 자리"
                    loading="lazy"
                  >
                </div>
                <div class="tools-slide">
                  <img
                    src="assets/slide-04.svg"
                    alt="슬라이드 4: 디자인 작업 이미지 자리"
                    loading="lazy"
                  >
                </div>
              </div>
              <div class="tools-slider-controls">
                <div
                  class="tools-slider-dots"
                  role="group"
                  aria-label="슬라이드 선택"
                >
                  <button
                    type="button"
                    class="is-active"
                    aria-label="첫 번째 이미지"
                    aria-current="true"
                    data-slide="0"
                  ></button>
                  <button
                    type="button"
                    aria-label="두 번째 이미지"
                    data-slide="1"
                  ></button>
                  <button
                    type="button"
                    aria-label="세 번째 이미지"
                    data-slide="2"
                  ></button>
                  <button
                    type="button"
                    aria-label="네 번째 이미지"
                    data-slide="3"
                  ></button>
                </div>
              </div>
            </div>
            <a href="resume.html" class="tile resume"
              ><span class="tile-title">Resume</span
              ><span class="tile-footer">Experience <b>↗</b></span></a
            >
          </div>
        </div>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
